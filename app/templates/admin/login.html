{% extends "base.html" %}
{% block title %}Admin login{% endblock %}
{% block mainclass %}narrow{% endblock %}
{% block content %}
<div class="card" style="max-width:400px;margin:48px auto;text-align:center;padding:34px 30px">
<img src="{{ url_for('static', filename='logo.jpg') }}" alt="{{ company }}" width="88" height="88" style="border-radius:14px;margin-bottom:14px">
<h1 style="font-size:28px">Recruiter login</h1>
<div style="text-align:left">
<form method="post">
  <label>Username</label><input type="text" name="username" autofocus>
  <label>Password</label><input type="password" name="password">
  <p style="margin-top:20px"><button class="btn" type="submit" style="width:100%">Log in</button></p>
</form></div></div>
{% endblock %}
